# _config.yml
title: "Aureliano Guedes"
author: "Aureliano Guedes"
description: "Articles on AI for refinery operations and technical document search, by Aureliano Guedes."
intro: "I build predictive models for refinery engineers and write about the data and code behind them."
linkedin_url: "https://www.linkedin.com/in/aureliano-guedes-30918021/"
github_url: "https://github.com/acpguedes"
profile_image: "/assets/images/profile.jpeg"

# Public address of the site
url: "https://acpguedes.github.io"
baseurl: "" # Empty because the site is served from the domain root

# Build settings
incremental: false
future: false
timezone: UTC
kramdown:
  auto_ids: true

# Plugins
plugins:
  - jekyll-feed

# Permalinks for posts without an explicit permalink
permalink: /:categories/:title/

# Keep everything that is not part of the site out of the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Rakefile
  - node_modules
  - vendor
  - posts/
  - "*.py"
  - design-system/
  - ds-bundle/

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
