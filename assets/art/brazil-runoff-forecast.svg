<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="title description">
<title id="title">Engraving: a Brazilian voting machine and its tally slip lead to a folded map and chart comparing the partial count with a national runoff projection.</title>
<desc id="description">Brazil, 2026 presidential runoff. The dashed ink line is the absolute error of the running tally and the vermilion line is the absolute error of the gradient boosting projection, in percentage points. The chart uses the notebook’s 12 chronological checkpoints from 0.5% to 20% of valid votes counted. At the 5% checkpoint, 24,754 stations had reported.</desc>

