<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</head>
<body>
  {% include site-nav.html %}
  <main class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>
      &copy; {{ "now" | date: "%Y" }} {{ site.author | escape }} ·
      <a href="{{ site.github_url }}">GitHub</a> ·
      <a href="{{ site.linkedin_url }}">LinkedIn</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </p>
  </footer>
</body>
</html>
