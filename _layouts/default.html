<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.art %}<meta property="og:image" content="{{ page.art | absolute_url }}">{% endif %}
  {% feed_meta %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</head>
<body>
  {% include site-nav.html %}
  {{ content }}
  <footer class="site-footer">
    <p>&copy; {{ "now" | date: "%Y" }} {{ site.author | escape }}</p>
    <ul class="link-row">
      <li><a href="{{ site.github_url }}">GitHub</a></li>
      <li><a href="{{ site.linkedin_url }}">LinkedIn</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">Feed</a></li>
    </ul>
  </footer>
</body>
</html>
