<section class="author-band" aria-label="About this site">
  <div class="who">
    <img src="{{ site.profile_image | relative_url }}" alt="{{ site.author | escape }}" width="60" height="60">
    <div>
      <p>{{ site.intro }}</p>
      <p class="aside">{{ site.tagline }}</p>
      <p class="meta">{% for topic in site.topics %}{% unless forloop.first %}<span aria-hidden="true">·</span>{% endunless %}<span{% if forloop.first %} class="kind"{% endif %}>{{ topic | escape }}</span>{% endfor %}</p>
    </div>
  </div>
  <ul class="link-row">
    <li><a class="accent" href="{{ '/about/' | relative_url }}">About</a></li>
    <li><a href="{{ '/articles/' | relative_url }}">All articles</a></li>
  </ul>
</section>
